<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Blocked — Easy Redirect</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <script src="themes.js"></script>
    <script src="theme.js"></script>
    <style>
        /* Dark defaults (Midnight); theme.js applies the theme chosen in the
           options page via :root[data-theme="<id>"]. */
        :root {
            --bg: #0F1120;
            --bg-card: #191C30;
            --text: #E8EAF6;
            --text-muted: #9095AD;
            --border: #2A2E48;
            --accent: #E53935;
            --accent-light: rgba(229,57,53,.18);
            --on-accent: #fff;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --radius: 10px;
            --page-bg: var(--bg);
            color-scheme: dark;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: var(--page-bg);
            font-family: var(--font);
            color: var(--text);
            padding: 32px 16px;
        }
        .card {
            max-width: 640px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: var(--radius);
            padding: 48px 48px 40px;
            text-align: center;
            box-shadow: 0 12px 44px rgba(0,0,0,.22);
        }
        #motivationQuote {
            display: none;
            position: relative;
            font-size: 34px;
            font-weight: 700;
            font-style: italic;
            color: var(--text);
            background: color-mix(in srgb, var(--accent) 13%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            border-left: 6px solid var(--accent);
            border-radius: 14px;
            padding: 44px 40px 44px 44px;
            text-align: center;
            margin: 0 0 32px;
            line-height: 1.35;
        }
        #motivationQuote.visible { display: block; }
        #motivationQuote::before {
            content: "\201C";
            position: absolute;
            left: 20px;
            top: 10px;
            font-size: 72px;
            line-height: 1;
            color: var(--accent);
            opacity: .4;
            font-family: Georgia, "Times New Roman", serif;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
        }
        .btn-primary:hover { opacity: .88; }
        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        #focusStreak { font-size: 15px; font-weight: 700; color: #ef6c00; margin: 0 0 20px; }
        #focusStreak:empty { display: none; }
        .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }
    </style>
</head>
<body>
<div class="card">
    <blockquote id="motivationQuote"></blockquote>
    <p id="focusStreak"></p>
    <div class="actions">
        <a class="btn btn-primary" href="#" id="goBackBtn" data-i18n="blockedPageGoBack">Go back</a>
        <a class="btn btn-secondary" id="settingsBtn"
           href="chrome-extension://PLACEHOLDER/options.html" data-i18n="blockedPageSettings">Settings</a>
    </div>
</div>
<script src="quotes.js"></script>
<script src="blocked.js"></script>
</body>
</html>
